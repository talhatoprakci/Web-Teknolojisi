<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius Kullanımı</title>
    <style>
        .box {
            background-color: red;
            width: 250px;
            height: 250px;
            border: 5px solid blue;
            /* Solid, Dashed, Dotted, double, inset */
            border-radius: 150px;
            padding: 50px;
            margin: auto;
            margin: top 50px;
            margin-left: 150px;
            margin-bottom: 50px;
        }

        .box2 {
            width: 250px;
            height: 250px;
            border: 5px solid black;
            border-color: blue;
            border-radius: 100%;
            margin: auto;
            padding: 20px 40px 50px 50px;  /*üst sag alt sol */
            text-align: center;
        
        }
    </style>

</head>

<body>
    <!--BORDER RADİUS KULLANIMI-->
    <div class="box">
        <h2>Border ve Radius </h2>
        <p>Bu Etiketlerin özelliklerini tanıyorum.</p>
    </div>
    <div class="box2">
        <h3>KUTU OTOMATİK YUVARLATMA</h3>
    </div>


</body>

</html>
